<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲 ¡Descubre tu Energía del Día! 🎲</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card main-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span style="font-size: 3rem;">🎲✨</span>
                        <h1 class="title h3 mt-2">¡Tu Energía del Día!</h1>
                        <p class="text-muted small">Una chispa de diversión y azar para tu jornada</p>
                    </div>
                    <form id="energyForm" novalidate>
                        <div class="mb-3">
                            <label for="diaInput" class="form-label fw-semibold">Día del mes (1 - 31)</label>
                            <input type="number" class="form-control" id="diaInput" min="1" max="31" placeholder="Ej. 15" required>
                            <div class="invalid-feedback" id="errorDia">Por favor, ingresa un día válido entre 1 y 31.</div>
                        </div>
                        <div class="mb-3">
                            <label for="mesSelect" class="form-label fw-semibold">Mes actual</label>
                            <select class="form-select" id="mesSelect" required>
                                <option value="" selected disabled>Selecciona el mes...</option>
                                <option value="1">Enero</option>
                                <option value="2">Febrero</option>
                                <option value="3">Marzo</option>
                                <option value="4">Abril</option>
                                <option value="5">Mayo</option>
                                <option value="6">Junio</option>
                                <option value="7">Julio</option>
                                <option value="8">Agosto</option>
                                <option value="9">Septiembre</option>
                                <option value="10">Octubre</option>
                                <option value="11">Noviembre</option>
                                <option value="12">Diciembre</option>
                            </select>
                            <div class="invalid-feedback" id="errorMes">Por favor, selecciona un mes válido.</div>
                        </div>
                        <div class="mb-4">
                            <label for="nombreInput" class="form-label fw-semibold">Tu Nombre</label>
                            <input type="text" class="form-control" id="nombreInput" placeholder="Ej. Alex" required>
                            <div class="invalid-feedback" id="errorNombre">Ingresa un nombre válido (solo letras, mín. 2 caracteres).</div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm" style="background: linear-gradient(45deg, #4e54c8, #8f94fb); border: none;">
                                Calcular mi Energía
                            </button>
                        </div>
                    </form>
                    <div id="resultadoContainer" class="mt-4 d-none">
                        <hr class="my-4">
                        <div class="text-center">
                            <h3 class="h5 fw-bold text-secondary mb-3">Paso a Paso del Cálculo</h3>
                            <p class="mb-2 text-muted" id="detalleCalculo"></p>
                            <div class="my-3">
                                <span class="text-muted small d-block mb-1">Último dígito obtenido:</span>
                                <span id="digitoResaltado" class="Resultado">0</span>
                            </div>
                            <div class="alert alert-info border-0 shadow-sm mt-3" role="alert">
                                <h4 class="alert-heading h6 fw-bold">🌟 Tu Categoría de Suerte:</h4>
                                <p class="mb-0 fs-5 fw-bold text-primary" id="categoriaResultado"></p>
                            </div>
                            <button type="button" id="btnReiniciar" class="btn btn-outline-secondary btn-sm mt-3">
                                🔄 Hacer otro cálculo
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
